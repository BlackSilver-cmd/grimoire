<details open><summary>📖 Easy guide: make your first scripted spell</summary>
<p class=mu><b>1. What is a script?</b> A short list of instructions the game follows when you cast. Type it in the box, press <b>Check script</b>, then <b>Create</b>. You don't need to know how to code. Copy a recipe below and change the numbers.</p>
<p class=mu><b>2. The four things you'll use most</b></p>
<p class=mu>• <code>foe</code> is the enemy you target. <code>me</code> is you. Look at stats with <code>foe.hp</code>, change them with <code>foe.atk *= 0.5</code> (halve its attack) or <code>me.hp += 20</code>.<br>
• <code>damage(foe, 50)</code> hits for 50. Use <code>me.atk</code> or <code>me.mag</code> to scale it: <code>damage(foe, me.mag * 2)</code>.<br>
• <code>stun(1)</code> makes the enemy lose a turn. <code>heal(30)</code> heals you.<br>
• <code>every(() => { ... }, 3)</code> repeats what's in the braces for 3 turns. <code>after(2, () => { ... })</code> does it once, 2 turns later.</p>
<p class=mu><b>3. Starter recipes (copy, paste, tweak)</b></p>
<p class=mu><b>Weaken:</b></p><pre>foe.atk *= 0.6;
foe.def *= 0.7;
log("The foe withers!");</pre>
<p class=mu><b>Slow burn:</b> damage every turn for 4 turns</p><pre>every(() => { damage(foe, me.mag * 0.6); }, 4);</pre>
<p class=mu><b>Delayed blast:</b></p><pre>log("Energy gathers...");
after(2, () => { damage(foe, me.mag * 4); });</pre>
<p class=mu><b>Vampire:</b> hurt and heal at once</p><pre>damage(foe, me.mag * 1.5);
heal(me.mag);</pre>
<p class=mu><b>Mana leech:</b> steal mana, and a long spell using it costs you nothing to keep up</p><pre>siphon(foe, 20);
every(() => { damage(foe, me.mag * 0.5); }, 4);</pre>
<p class=mu><b>Remember things:</b> <code>mem</code> keeps numbers between turns, e.g. <code>mem.count = 0;</code> then <code>mem.count += 1;</code> inside <code>every</code>.</p>
<p class=mu><b>4. What it costs</b></p>
<p class=mu>• Casting takes a share of your <b>max mana</b>, up to half. Longer, stronger scripts cost more. <b>Check script</b> shows the exact number.<br>
• A spell that lasts several turns costs <b>30% of your base mana</b> for each extra turn.<br>
• Can't pay? It drains <b>HP and at least 1 energy</b> instead. If that would kill you it burns an extra energy point to spare you, and if you have none left, the spell collapses.<br>
• Feeding on a foe with <code>siphon</code> pays the upkeep for you, but a foe's <b>Mana Zone</b> blocks it. Beat the zone with <code>breakZone()</code> or <code>feedZone(10)</code>, or check <code>zoneActive()</code> first.</p>
<p class=mu><b>5. Good to know</b></p>
<p class=mu>• Normal foes can be defeated outright. Bosses resist and keep 35–40% of their health, so use stuns, weakening and damage over time on them.<br>
• Loops that never end get stopped. Mistakes show up as a red message when you press <b>Check script</b>, so test before you pay.<br>
• Start small. Make a one-liner, try it in a fight, then add lines. Bigger ideas like Black Star are in the reference below.</p></details>
<details><summary>JavaScript reference &amp; examples</summary><p class=mu>Your code is real JavaScript: variables, <code>if</code>, loops, functions, arrays, <code>Math</code>, anything the language allows. It runs once when you cast. Older scripts made with simple commands still work.</p>
<p class=mu><b>Objects:</b> <code>me</code> (hp mp atk mag def agi maxhp maxmp) · <code>foe</code> (the target: hp mp atk def agi maxhp maxmp name element lv boss alive) · <code>foes</code> (all living enemies, same fields) · <code>lv</code> · <code>turn</code> · <code>mem</code> (an empty object to remember things for later turns). Set values like <code>foe.atk *= 0.6</code>.</p>
<p class=mu><b>Functions:</b> <code>log(text)</code> · <code>stun(n)</code> or <code>stun(someFoe, n)</code> · <code>damage(target, amount)</code> (target is <code>me</code> or a foe) · <code>heal(amount)</code> · <code>dot(foe, amountPerTurn, turns, name)</code> · <code>every(fn, turns)</code> runs <code>fn</code> at the end of each turn · <code>after(turns, fn)</code> runs once later · <code>onEnd(fn)</code> · <code>onHit(fn, turns)</code> lets you change every attack: <code>fn</code> receives <code>{amount, from, target}</code> (<code>from</code> is "me" or "foe") and returns the new amount · <code>rand(n)</code> gives 0 to n-1.</p>
<p class=mu><b>Black Star</b> (halve every attack for 3 turns, store the lost damage, release it on the enemies):</p><pre>mem.store = 0;
log("Black Star blooms!");
onHit(hit => {
  const cut = Math.floor(hit.amount / 2);
  mem.store += cut;
  return hit.amount - cut;
}, 3);
after(3, () => {

 if(G&&G.view=='main'&&MP.nq.length){G.q=G.q||[];while(MP.nq.length)G.q.push(MP.nq.shift());G.view='ev';G.res=null;G.evh='🌐 '+MP.dn;ch=1}
 }finally{MP.fl=0}if(ch&&!nr)render()}
function mpGold(pid){const el=$('#mgg_'+pid),a=Math.floor(+(el&&el.value));if(!(a>=1)||a>G.gold||G.view!='main')return;G.gold-=a;const id=mpSend(pid,'gold',{a});mpTrack(id,()=>{G.gold+=a},`${a} gold`);G.msg=`You sent ${a} gold.`;render()}
function mpTrack(id,refund,what){if(!id)return;MP.out[id]=1;if(typeof setTimeout=='function')setTimeout(()=>{if(MP.out[id]){delete MP.out[id];if(G){refund();G.msg=`${what} could not be delivered and was returned to you.`;render()}}},8000)}
function mpItem(pid){const k=$('#mgi_'+pid)&&$('#mgi_'+pid).value,q=Math.max(1,Math.floor(+($('#mgq_'+pid)&&$('#mgq_'+pid).value)||1));if(!k||!G.inv[k]||G.view!='main')return;const n=Math.min(q,G.inv[k]);inv(k,-n);const id=mpSend(pid,'item',{k,q:n});mpTrack(id,()=>inv(k,n),`${n}× ${k}`);G.msg=`You gave ${n}× ${k}.`;render()}
function mpGearList(){const L=[];G.weapons.forEach((w,i)=>{if(!w.cid&&!w.mag)L.push(['w:'+i,w.n+(w.leg?' ★':'')])});G.armors.forEach((a,i)=>L.push(['a:'+i,a.n]));G.accs.forEach((k,i)=>L.push(['c:'+i,ACC[k]?ACC[k][0]:k]));return L}
function mpGear(pid){const v=$('#mgs_'+pid)&&$('#mgs_'+pid).value;if(!v||G.view!='main')return;const [k,is]=v.split(':'),i=+is;let g,payload;
 if(k=='w'){g=G.weapons[i];if(!g||g.cid||g.mag)return;const ob=JSON.parse(JSON.stringify(g));payload={k:'w',g:ob};G.weapons.splice(i,1);['wi','w2'].forEach(f=>{if(G[f]==i)G[f]=-1;else if(G[f]>i)G[f]--})}
 else if(k=='a'){g=G.armors[i];if(!g)return;payload={k:'a',g:JSON.parse(JSON.stringify(g))};G.armors.splice(i,1);if(G.ai==i)G.ai=-1;else if(G.ai>i)G.ai--}
 else if(k=='c'){const a=G.accs[i];if(!a)return;payload={k:'c',a,g:{n:ACC[a]?ACC[a][0]:a}};G.accs.splice(i,1);if(G.acc==a)G.acc=G.accs[0]||null}
 else return;const id=mpSend(pid,'gear',payload);const back=()=>{if(payload.k=='w')G.weapons.push(payload.g);else if(payload.k=='a')G.armors.push(payload.g);else{G.accs.push(payload.a);if(!G.acc)G.acc=payload.a}};mpTrack(id,back,payload.g.n);G.msg=`You gave away ${payload.g.n}.`;render()}
function playersHtml(){const ps=MP.players,me=pname();
 let h=`<div class=c><h3>🌐 ${esc(MP.dn)}</h3><p class=mu>${MP.mode=='new'?'New game together':'Meeting with existing saves'} · ${mpOnline()} online${MP.host?' · you are the host':''}</p><div class=rl><button class=g onclick="mpLeave()">Leave room</button></div></div>`;
 if(!ps.length)h+='<div class=c><p class=mu>No other players yet. Share the room name with friends: they open this artifact, tap Multiplayer, and join it.</p></div>';
 const gl=mpGearList(),il=Object.keys(G.inv);
 ps.forEach(p=>{h+=`<div class=c><b>${esc(p.nm)}</b> ${p.on?'<span class=ok>● online</span>':'<span class=mu>○ offline</span>'}${p.host?' 👑':''}${p.on?`<p class=mu>Age ${p.age} · Lv ${p.lv} · ${esc(p.el)} · ${esc(p.race)}</p>`:''}
 ${MP.host?`<label class=mu><input type=checkbox ${MP.deny.includes(p.pid)?'':'checked'} onchange="mpTog('${p.pid}')"> Allowed to advance time</label>`:''}
 ${p.on?`<div class=rl><input id=mgg_${p.pid} type=number min=1 placeholder="Gold" style="width:90px"><button onclick="mpGold('${p.pid}')">Gift gold</button></div>
 <div class=rl>${il.length?`<select id=mgi_${p.pid} style="width:auto">${il.map(k=>`<option value="${esc(k)}">${esc(k)} ×${G.inv[k]}</option>`).join('')}</select><input id=mgq_${p.pid} type=number min=1 value=1 style="width:60px"><button onclick="mpItem('${p.pid}')">Give item</button>`:'<span class=mu>No items to give.</span>'}</div>
 <div class=rl><button onclick="mpAct('${p.pid}','chal')">⚔ Challenge</button><button class=g onclick="mpAct('${p.pid}','pinv')">${mpPartyHas(p.pid)?'Leave party':'🧭 Invite to party'}</button>${mpCanProp(p)?`<button class=g onclick="mpAct('${p.pid}','prop')">💍 Propose</button>`:`<span class=mu>${esc(mpPropWhy(p)||'')}</span>`}${G.mar&&G.rel[G.lover]&&G.rel[G.lover].pl==p.pid?'<span class=tag>💞 your spouse</span>':''}${mpPartyHas(p.pid)?'<span class=tag>in your party</span>':''}</div>
 <div class=rl>${Object.entries(G.rel).filter(([k,r])=>!r.pl&&['friend','mentor'].includes(r.role)).length?`<select id=mgn_${p.pid} style="width:auto">${Object.entries(G.rel).filter(([k,r])=>!r.pl&&['friend','mentor'].includes(r.role)).map(([k,r])=>`<option value="${esc(k)}">${esc(k)}${r.role=='mentor'?' (mentor)':''}</option>`).join('')}</select><button class=g onclick="mpIntro('${p.pid}')">🤝 Introduce</button>`:'<span class=mu>No friends or mentors to introduce.</span>'}</div>
 <div class=rl>${gl.length?`<select id=mgs_${p.pid} style="width:auto">${gl.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join('')}</select><button onclick="mpGear('${p.pid}')">Give gear</button>`:'<span class=mu>No gear to give.</span>'}</div>`:''}</div>`});
 if(MP.host&&!ps.length)h+='';return h}
function mpHtml(){let h='';
 if(MP.room){const sl='mp-'+MP.rn.slice(3);
  h=`<div class=c><h2>🌐 ${esc(MP.dn)}</h2><p class=mu>${MP.mode=='new'?'New game together: each player makes a fresh character. Play starts once two players are in the room.':'Meet: bring a character from one of your saves.'} · ${mpOnline()} here</p></div>`;
  if(MP.mode=='meet'){for(let n=1;n<=NSL;n++){const d=rdSlot(n);if(d)h+=`<div class=c><b>Slot ${n}: ${esc(d.name)}${d.last?' '+esc(d.last):''}</b><p class=mu>${esc(d.aff)}${d.sub?' / '+esc(d.sub):''} · Age ${d.age} · Level ${d.lv}</p><div class=rl><button onclick="mpUse(${n})">Play this character</button></div></div>`}
   if(!Array.from({length:NSL},(_,i)=>rdSlot(i+1)).some(Boolean))h+='<div class=c><p class=mu>You have no saves yet. Create a character in the single-player menu first.</p></div>'}
  else h+=rdSlot(sl)?`<div class=c><div class=rl><button onclick="mpUse('${sl}')">Continue your character</button></div></div>`:`<div class=c><div class=rl><button onclick="SV='${sl}';render()">Create your character</button></div></div>`;
  return h+`<div class=c><button class=g onclick="mpLeave()">Leave room</button></div>`}
 h=`<div class=c><button class=g onclick="mpClose()">← Back to slots</button></div><div class=c><h2>🌐 Multiplayer</h2><p class=mu>Play with friends who have this page open. Saves stay on each device; the host's device keeps the room.</p></div>`;
 if(MP.state==1)return h+'<div class=c><p class=mu>Connecting…</p></div>';
 if(MP.state==3)return h+'<div class=c><p class=mu>Multiplayer is not available here. It needs the room feature enabled on this artifact, and you need to be signed in with access to it.</p></div>';
 if(MP.err)h+=`<div class=msg>${esc(MP.err)}</div>`;
 h+=`<div class=c><b>Host a room</b>Room name<input id=mpn maxlength=30 placeholder="e.g. Clover Kingdom"><select id=mpm><option value=new>🌱 New game together (needs 2+ players)</option><option value=meet>🤝 Meet: everyone brings an existing save</option></select><div class=rl><button onclick="mpHost()">Create room</button></div></div>`;
 h+=`<div class=c><b>Find a room</b><input placeholder="Search room names" value="${esc(MP.q)}" oninput="mpSearch(this.value)"><div id=mprl>${mpRoomList()}</div></div>`;return h}
function mpUse(n){MP.scr=null;loadG(n)}
function render(){const a=$('#app');if(!G){a.innerHTML=(MP.scr&&!SV)?mpHtml():startHtml();return}if(MP.room){mpPres();mpPoolSync();mpFlush(1)}if(G.view!='end')chkMoves();
 if(G.view=='end'){a.innerHTML=endHtml();try{localStorage.setItem(skey(SLOT),JSON.stringify(G))}catch(e){}return}
 if(G.view=='battle')a.innerHTML=hdr(1)+battleHtml();else if(G.view=='ev')a.innerHTML=hdr(1)+evHtml();else if(G.view=='mk')a.innerHTML=hdr(1)+bdHtml();
 else{a.innerHTML=hdr()+tabs()+(G.msg?`<div class=msg>${esc(G.msg)}</div>`:'')+(mpWait()?`<div class=c><h3>⏳ Waiting for players</h3><p class=mu>${esc(MP.dn)} is a new-game room. Play starts when at least two players are here (${mpOnline()}/2).</p></div>`:panel())+'<div class=c><button class=g onclick=toSlots()>Save &amp; switch slot</button></div>';try{localStorage.setItem(skey(SLOT),JSON.stringify(G))}catch(e){}}}
render();
</script></body></html>
